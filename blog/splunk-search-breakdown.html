<style>

/* =========================================================
   CYBER.FAL — SPLUNK ARTICLE
   Relearning Splunk: From Query to Detection
========================================================= */


/* =========================================================
   PAGE WRAPPER
========================================================= */

.post-page {
    width: min(1180px, calc(100% - 48px));
    margin: 0 auto;
    padding: 35px 0 100px;
}


.post-back {
    display: inline-flex;
    align-items: center;

    margin-bottom: 30px;

    color: var(--purple-light);

    font-family: "JetBrains Mono", monospace;
    font-size: 11px;

    transition:
        color 0.2s ease,
        transform 0.2s ease;
}


.post-back:hover {
    color: var(--pink);

    transform: translateX(-4px);
}


/* =========================================================
   ARTICLE HERO
========================================================= */

.post-hero {
    display: grid;

    grid-template-columns:
        minmax(0, 1.2fr)
        minmax(320px, 0.8fr);

    gap: 55px;

    align-items: center;

    padding: 50px;

    margin-bottom: 24px;

    border:
        1px solid #343741;

    border-radius: 17px;

    background:
        radial-gradient(
            circle at 87% 15%,
            rgba(168, 85, 247, 0.15),
            transparent 36%
        ),
        linear-gradient(
            145deg,
            #101219,
            #090a0f
        );

    box-shadow:
        0 25px 70px
        rgba(0, 0, 0, 0.18);
}


.post-kicker {
    margin-bottom: 10px;

    color: #c084fc;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 9px;

    font-weight: 600;

    letter-spacing: 1.5px;

    text-transform: uppercase;
}


.post-hero h1 {
    margin: 0 0 22px;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size:
        clamp(44px, 5vw, 69px);

    line-height: 1.08;

    letter-spacing: -3px;

    color: #f4f4f7;
}


.post-hero h1 span {
    display: block;

    margin-top: 5px;

    color: var(--pink);
}


.post-lead {
    max-width: 700px;

    color: #a9acb8;

    font-size: 14px;

    line-height: 1.9;
}


.post-tags {
    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 25px;
}


.post-tags span {
    padding: 7px 11px;

    border:
        1px solid rgba(168, 85, 247, 0.30);

    border-radius: 7px;

    background:
        rgba(168, 85, 247, 0.065);

    color: #debaff;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 9px;
}


/* =========================================================
   HERO TERMINAL
========================================================= */

.post-hero-terminal {
    overflow: hidden;

    border:
        1px solid #343741;

    border-radius: 12px;

    background: #07090e;

    box-shadow:
        0 25px 70px
        rgba(0, 0, 0, 0.35);
}


.mini-terminal-top {
    min-height: 48px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 16px;

    border-bottom:
        1px solid #2c2f38;
}


.mini-terminal-top > div {
    display: flex;

    gap: 7px;
}


.mini-terminal-top span {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #fa5f56;
}


.mini-terminal-top span:nth-child(2) {
    background: #f6bd3b;
}


.mini-terminal-top span:nth-child(3) {
    background: #54c45d;
}


.mini-terminal-top small {
    color: #a5a8b5;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 8px;
}


.mini-terminal-body {
    padding: 27px;

    color: #c4c6cf;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 11px;

    line-height: 1.95;
}


.terminal-purple {
    color: #c084fc;
}


.terminal-green {
    color: var(--green);
}


/* =========================================================
   NUMBERED ARTICLE SECTIONS
========================================================= */

.post-section {
    position: relative;

    display: grid;

    grid-template-columns:
        64px
        minmax(0, 1fr);

    gap: 22px;

    margin-bottom: 18px;

    padding: 38px 36px;

    overflow: visible;

    border:
        1px solid #343741;

    border-radius: 13px;

    background:
        linear-gradient(
            145deg,
            #101219,
            #0c0e14
        );
}


/* =========================================================
   VERTICAL TIMELINE
========================================================= */

.post-section::before {
    content: "";

    position: absolute;

    left: 58px;
    top: 72px;
    bottom: -19px;

    width: 1px;

    background:
        linear-gradient(
            to bottom,
            rgba(192, 132, 252, 0.75),
            rgba(168, 85, 247, 0.18)
        );

    z-index: 0;
}


.post-section::after {
    content: "";

    position: absolute;

    left: 54px;
    top: 68px;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #c084fc;

    box-shadow:
        0 0 0 4px #101219,
        0 0 14px
        rgba(168, 85, 247, 0.55);

    z-index: 2;
}


/* =========================================================
   SECTION NUMBER BOX
========================================================= */

.post-section-label {
    position: relative;

    z-index: 3;

    width: 46px;
    height: 46px;

    display: grid;

    place-items: center;

    align-self: start;

    border:
        1px solid
        rgba(192, 132, 252, 0.55);

    border-radius: 7px;

    background:
        linear-gradient(
            145deg,
            rgba(168, 85, 247, 0.15),
            rgba(168, 85, 247, 0.035)
        );

    color: #c084fc;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 17px;

    font-weight: 600;

    box-shadow:
        0 0 18px
        rgba(168, 85, 247, 0.06);
}


/* =========================================================
   SECTION TYPOGRAPHY
========================================================= */

.post-section-body {
    min-width: 0;
}


.post-section-body h2,
.analyst-takeaway h2,
.process-section h2,
.bonus-section h2,
.post-social h2 {
    margin: 0 0 15px;

    color: #f4f4f7;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size:
        clamp(22px, 2.6vw, 31px);

    line-height: 1.3;
}


.post-section-body > p {
    max-width: 810px;

    margin:
        0 0 15px;

    color: #a4a7b2;

    font-size: 12px;

    line-height: 1.85;
}


/* =========================================================
   LEARNING GRID
========================================================= */

.learning-grid {
    display: grid;

    grid-template-columns:
        repeat(5, minmax(0, 1fr));

    gap: 12px;

    margin-top: 25px;
}


.learning-card {
    min-height: 175px;

    display: flex;

    flex-direction: column;

    justify-content: flex-start;

    padding: 19px;

    border:
        1px solid #30333d;

    border-radius: 9px;

    background:
        linear-gradient(
            145deg,
            #0d1017,
            #090b10
        );

    transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
}


.learning-card:hover {
    transform:
        translateY(-4px);

    border-color:
        rgba(168, 85, 247, 0.65);

    background:
        linear-gradient(
            145deg,
            rgba(168, 85, 247, 0.10),
            #0b0d13
        );

    box-shadow:
        0 12px 30px
        rgba(0, 0, 0, 0.20);
}


.learning-card-icon {
    width: 30px;
    height: 30px;

    margin-bottom: 17px;

    color: #b45cff;
}


.learning-card-icon svg {
    width: 100%;
    height: 100%;

    stroke: currentColor;

    fill: none;

    stroke-width: 1.7;

    stroke-linecap: round;

    stroke-linejoin: round;
}


.learning-card > span {
    color:
        rgba(192, 132, 252, 0.70);

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 8px;

    letter-spacing: 0.8px;
}


.learning-card strong {
    display: block;

    margin:
        7px 0 8px;

    color: #e1c4ff;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 11px;
}


.learning-card p {
    margin: 0;

    color: #9699a5;

    font-size: 9px;

    line-height: 1.65;
}


/* =========================================================
   WINDOWS EVENT 4946 CARD
========================================================= */

.event-card {
    display: grid;

    grid-template-columns:
        165px
        minmax(0, 1fr);

    gap: 23px;

    align-items: center;

    margin:
        24px 0 18px;

    padding: 14px;

    border:
        1px solid
        rgba(168, 85, 247, 0.30);

    border-radius: 9px;

    background:
        linear-gradient(
            90deg,
            rgba(168, 85, 247, 0.13),
            rgba(168, 85, 247, 0.03)
        );
}


.event-number {
    min-height: 105px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    border:
        1px solid
        rgba(232, 121, 249, 0.30);

    border-radius: 7px;

    background:
        rgba(168, 85, 247, 0.07);

    color: #e879f9;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 30px;
}


.event-number::before {
    content: "EVENT ID";

    margin-bottom: 4px;

    color: #c084fc;

    font-size: 7px;

    letter-spacing: 1px;
}


.event-card > div:last-child span {
    color: #c084fc;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 8px;

    letter-spacing: 1px;
}


.event-card > div:last-child h3 {
    margin:
        7px 0;

    color: #f3f3f6;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 15px;
}


.event-card > div:last-child p {
    margin: 0;

    color: #999ca8;

    font-size: 10px;

    line-height: 1.7;
}


/* =========================================================
   BIG QUESTION BAR
========================================================= */

.big-question {
    display: flex;

    align-items: center;

    gap: 12px;

    margin-top: 15px;

    padding:
        12px 16px;

    border:
        1px solid
        rgba(168, 85, 247, 0.30);

    border-radius: 6px;

    background:
        linear-gradient(
            90deg,
            rgba(168, 85, 247, 0.14),
            rgba(168, 85, 247, 0.025)
        );

    color: #e3c4ff;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 11px;
}


.big-question::before {
    content: "?";

    width: 22px;
    height: 22px;

    flex-shrink: 0;

    display: grid;

    place-items: center;

    border:
        1px solid #c084fc;

    border-radius: 50%;

    color: #c084fc;

    font-size: 11px;
}


/* =========================================================
   INFO BOX
========================================================= */

.info-box {
    display: flex;

    align-items: flex-start;

    gap: 16px;

    padding:
        18px 20px;

    margin:
        20px 0;

    border:
        1px solid
        rgba(168, 85, 247, 0.30);

    border-left:
        4px solid #a855f7;

    border-radius: 9px;

    background:
        linear-gradient(
            90deg,
            rgba(168, 85, 247, 0.11),
            rgba(168, 85, 247, 0.025)
        );
}


.info-box-icon {
    width: 27px;
    height: 27px;

    flex-shrink: 0;

    display: grid;

    place-items: center;

    border:
        1px solid
        rgba(168, 85, 247, 0.45);

    border-radius: 50%;

    color: #c084fc;
}


.info-box-icon svg {
    width: 15px;
    height: 15px;

    stroke: currentColor;

    fill: none;

    stroke-width: 1.8;
}


.info-box-content {
    flex: 1;
}


.info-box-content strong {
    display: block;

    margin-bottom: 5px;

    color: #e3c7ff;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 11px;
}


.info-box-content p {
    margin: 0;

    color: #b1b4c0;

    font-size: 11px;

    line-height: 1.75;
}


/* =========================================================
   ANALYST CONTEXT CARDS
========================================================= */

.context-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;

    margin:
        24px 0 12px;
}


.context-card {
    min-height: 120px;

    padding: 18px;

    border:
        1px solid #30333d;

    border-radius: 8px;

    background:
        linear-gradient(
            145deg,
            #0d1017,
            #090b10
        );
}


.context-card.normal {
    border-color:
        rgba(86, 226, 125, 0.25);
}


.context-card.investigate {
    border-color:
        rgba(239, 115, 115, 0.25);
}


.context-card span {
    color: #c084fc;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 7px;

    letter-spacing: 1px;
}


.context-card h3 {
    margin:
        8px 0;

    color: #f3f3f6;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 14px;
}


.context-card p {
    margin: 0;

    color: #9699a5;

    font-size: 10px;

    line-height: 1.7;
}


/* =========================================================
   RISK PILLS
========================================================= */

.risk-list {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;

    margin-top: 11px;
}


.risk-list div {
    padding:
        8px 11px;

    border:
        1px solid #30333d;

    border-radius: 5px;

    background:
        rgba(9, 11, 16, 0.85);

    color: #c7a9e8;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 8px;

    text-align: center;

    transition:
        0.2s ease;
}


.risk-list div:hover {
    border-color:
        rgba(168, 85, 247, 0.55);

    background:
        rgba(168, 85, 247, 0.07);
}


/* =========================================================
   SPL CODE BLOCK
========================================================= */

.spl-code {
    overflow: hidden;

    margin-top: 22px;

    border:
        1px solid #30333d;

    border-radius: 8px;

    background: #07090e;

    box-shadow:
        inset 0 0 30px
        rgba(168, 85, 247, 0.025);
}


.spl-code-header {
    min-height: 42px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        7px 13px;

    border-bottom:
        1px solid #30333d;

    color: #c084fc;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 8px;
}


.spl-code pre {
    overflow-x: auto;

    margin: 0;

    padding:
        20px 20px 20px 48px;

    position: relative;
}


.spl-code code {
    color: #e1e2e8;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 10px;

    line-height: 1.9;

    white-space: pre-wrap;
}


/* =========================================================
   QUERY BREAKDOWN TABLE
========================================================= */

.query-table-wrapper {
    width: 100%;

    overflow-x: auto;

    margin-top: 22px;

    border:
        1px solid #30333d;

    border-radius: 8px;

    background: #080a0f;
}


.query-table {
    width: 100%;

    margin: 0;

    border-collapse: collapse;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 9px;
}


.query-table thead {
    background:
        linear-gradient(
            90deg,
            rgba(168, 85, 247, 0.17),
            rgba(168, 85, 247, 0.05)
        );
}


.query-table th {
    padding:
        11px 15px;

    border-bottom:
        1px solid #30333d;

    color: #c084fc;

    text-align: left;

    font-size: 8px;

    font-weight: 500;
}


.query-table td {
    padding:
        11px 15px;

    border-bottom:
        1px solid
        rgba(48, 51, 61, 0.75);

    color: #adb0bb;

    vertical-align: top;

    line-height: 1.6;
}


.query-table tbody tr:last-child td {
    border-bottom: none;
}


.query-table td:first-child {
    width: 32%;

    color: #f06adf;

    background:
        rgba(168, 85, 247, 0.045);

    font-weight: 500;
}


.query-table tbody tr {
    transition:
        background 0.2s ease;
}


.query-table tbody tr:hover {
    background:
        rgba(168, 85, 247, 0.055);
}


/* =========================================================
   OLD QUERY STEP FALLBACK
   Keep this in case any old markup remains
========================================================= */

.query-breakdown {
    display: grid;

    gap: 9px;

    margin-top: 22px;
}


.query-step {
    display: grid;

    grid-template-columns:
        minmax(210px, 0.75fr)
        minmax(0, 1.25fr);

    overflow: hidden;

    border:
        1px solid #30333d;

    border-radius: 7px;

    background: #090b10;
}


.query-command {
    display: flex;

    align-items: center;

    padding: 15px;

    background:
        rgba(168, 85, 247, 0.09);

    color: #f06adf;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 9px;
}


.query-explanation {
    padding: 15px;
}


.query-explanation span {
    color: #c084fc;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 7px;
}


.query-explanation p {
    margin-top: 4px;

    color: #999ca8;

    font-size: 9px;

    line-height: 1.65;
}


/* =========================================================
   DASHBOARD FEATURE
========================================================= */

.dashboard-feature {
    margin:
        20px 0;

    padding:
        15px 18px;

    border:
        1px solid
        rgba(168, 85, 247, 0.35);

    border-radius: 7px;

    background:
        linear-gradient(
            90deg,
            rgba(168, 85, 247, 0.16),
            rgba(168, 85, 247, 0.035)
        );
}


.dashboard-feature span {
    color: #c084fc;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 7px;
}


.dashboard-feature h3 {
    margin-top: 4px;

    color: #e8caff;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 14px;
}


.dashboard-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

    margin-top: 20px;
}


.dashboard-card {
    min-height: 110px;

    padding: 17px;

    border:
        1px solid #30333d;

    border-radius: 8px;

    background: #090b10;
}


.dashboard-card > span {
    font-size: 18px;
}


.dashboard-card strong {
    display: block;

    margin:
        10px 0 5px;

    color: #dcb8ff;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 9px;
}


.dashboard-card p {
    margin: 0;

    color: #9699a5;

    font-size: 8px;

    line-height: 1.65;
}


/* =========================================================
   QUOTE FEATURE
========================================================= */

.quote-feature {
    margin:
        20px 0;

    padding:
        17px 20px;

    border-left:
        3px solid #a855f7;

    border-radius:
        0 7px 7px 0;

    background:
        linear-gradient(
            90deg,
            rgba(168, 85, 247, 0.13),
            rgba(168, 85, 247, 0.025)
        );
}


.quote-feature > span {
    display: block;

    color: #c084fc;

    font-size: 22px;
}


.quote-feature p {
    margin: 0;

    color: #e5e5ea;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 11px;
}


.quote-feature strong {
    color: var(--pink);
}


/* =========================================================
   INVESTIGATION QUESTIONS
========================================================= */

.investigation-list {
    display: grid;

    gap: 6px;
}


.investigation-list > div {
    min-height: 38px;

    display: grid;

    grid-template-columns:
        38px
        1fr;

    align-items: center;

    padding:
        8px 12px;

    border:
        1px solid #30333d;

    border-radius: 5px;

    background: #090b10;
}


.investigation-list span {
    color: #c084fc;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size: 8px;
}


.investigation-list p {
    margin: 0;

    color: #c3c5cd;

    font-size: 9px;
}


/* =========================================================
   SUMMARY GRID
========================================================= */

.article-summary-grid {
    display: grid;

    grid-template-columns:
        0.85fr
        1.35fr;

    gap: 14px;

    margin:
        20px 0;
}


/* =========================================================
   SOC ANALYST TAKEAWAY
========================================================= */

.analyst-takeaway {
    padding: 30px;

    margin: 0;

    border:
        1px solid
        rgba(86, 226, 125, 0.22);

    border-radius: 12px;

    background:
        linear-gradient(
            145deg,
            rgba(86, 226, 125, 0.065),
            #090b10
        );
}


.analyst-takeaway .post-kicker {
    color: var(--green);
}


.analyst-takeaway h2 {
    font-size: 20px;
}


.analyst-takeaway > p:not(.post-kicker) {
    margin-top: 8px;

    color: #9da0aa;

    font-size: 10px;

    line-height: 1.7;
}


.takeaway-highlight {
    color:
        var(--green) !important;

    font-family:
        "JetBrains Mono",
        monospace;

    font-size:
        15px !important;

    line-height: 1.55 !important;
}


/* =========================================================
   PROCESS / GOAL
========================================================= */

.process-section,
.bonus-section,
.post-social {
    padding: 30px;

    border:
        1px solid #343741;

    border-radius: 12px;

    background:
        linear-gradient(
            145deg,
            #101219,
            #0c0e14
        );
}


.process-section {
    margin: 0;
}


.process-section h2,
.bonus-section h2 {
    font-size: 20px;
}


.process-section > p:not(.post-kicker),
